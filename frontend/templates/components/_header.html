<header class="site-header">
  <div class="site-header__inner glass-surface">
    <div class="site-header__brand">
      <div class="site-header__mark" aria-hidden="true">CDE</div>
      <div>
        <p class="site-header__eyebrow">CDE STUDIO</p>
        <h1 class="site-header__title">CDE 스튜디오 대여 현황</h1>
        <p class="site-header__date">{{ date_label }}</p>
      </div>
    </div>

    <div class="site-header__controls">
      <div class="tooltip-trigger">
        <button
          type="button"
          id="open-export-dialog"
          class="button button--export"
          aria-haspopup="dialog"
          aria-controls="export-dialog"
          aria-describedby="export-tooltip">
          <svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" />
          </svg>
          <span>엑셀·TXT 추출하기</span>
        </button>
        <span id="export-tooltip" class="tooltip" role="tooltip">
          선택한 월 또는 일 단위 기간의 예약완료 내역을 엑셀·TXT로 다운로드합니다.
        </span>
      </div>

      <div class="site-header__actions">
        <span id="spinner" class="htmx-indicator loading-indicator">로딩 중…</span>
        <button
          hx-get="/table"
          hx-target="#table-container"
          hx-swap="innerHTML"
          hx-indicator="#spinner"
          class="button button--refresh">
          새로고침
        </button>
      </div>
    </div>
  </div>
</header>
