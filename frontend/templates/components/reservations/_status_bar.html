<div class="reservation-status-bar">
  <div class="reservation-status-bar__summary">
    <span class="reservation-status-bar__label">오늘 예약</span>
    <strong class="reservation-status-bar__total">{{ total }}</strong>
    <span class="reservation-status-bar__unit">건</span>
    <span class="reservation-status-bar__divider" aria-hidden="true"></span>
    <span class="reservation-status-bar__confirmed">
      <span class="reservation-status-bar__confirmed-dot" aria-hidden="true"></span>
      예약완료 {{ confirmed }}건
    </span>
  </div>
  <span class="reservation-status-bar__updated">
    <span class="reservation-status-bar__live-dot" aria-hidden="true"></span>
    {{ updated_at }} 기준
  </span>
</div>
